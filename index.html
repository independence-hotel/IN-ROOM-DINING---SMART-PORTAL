<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>SmartDine | Independence Hotel</title>
    <meta name="theme-color" content="#1B365D">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
            colors: { navyPrimary: '#1B365D', navyDark: '#0A192F', cardWhite: '#FFFFFF' } } }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background-color: #e2e8f0; touch-action: manipulation; }
        ::-webkit-scrollbar { width: 0; background: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        .btn-press:active { transform: scale(0.95); transition: transform 0.12s ease; }
        .app-container { max-width: 430px; margin: 0 auto; min-height: 100vh; background: #F8FAFC; box-shadow: 0 10px 25px -5px rgba(0,0,0,.1); }
        @keyframes shimmer { 0%{transform:translateX(-120%)} 100%{transform:translateX(220%)} }
        .hdr-shine::before { content:''; position:absolute; inset:0; background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.08) 50%,transparent 60%); animation:shimmer 3.5s infinite ease-in-out; pointer-events:none; }
        @keyframes slideUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
        .card-enter { animation:slideUp .38s cubic-bezier(.16,1,.3,1) forwards; opacity:0; }
        @keyframes qtyPop { 0%{transform:scale(1)} 40%{transform:scale(1.35);color:#1B365D} 100%{transform:scale(1)} }
        .qty-pop { animation:qtyPop .22s ease; }
        
        .menu-card { transition:box-shadow .2s,transform .2s; }
        .menu-card:hover { box-shadow:0 6px 18px rgba(27,54,93,.1); transform:translateY(-1px); }
        .qty-btn:hover { background:#F0F9FF !important; color:#1B365D; border-color:#38BDF8; }
        
        @keyframes footerIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        .footer-bar { animation:footerIn .5s cubic-bezier(.16,1,.3,1) both; }
        @keyframes numFlip { 0%{transform:translateY(-8px);opacity:0} 100%{transform:translateY(0);opacity:1} }
        .num-flip { animation:numFlip .18s ease forwards; }
        @keyframes pulseGlow { 0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(56,189,248,.4);border-color:rgba(56,189,248,.5)} 50%{transform:scale(1.05);box-shadow:0 0 18px 5px rgba(56,189,248,.5);border-color:rgba(56,189,248,1)} }
        .step-pulse { animation:pulseGlow 1.8s infinite ease-in-out; }

        /* Slide Track */
        .slide-track {
            background: linear-gradient(135deg, #0A192F 0%, #1B365D 60%, #0f2a4a 100%);
            border: 1.5px solid rgba(56,189,248,0.45);
            box-shadow: 0 0 0 3px rgba(56,189,248,0.12), 0 4px 24px rgba(10,25,47,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
            border-radius: 16px; position: relative; overflow: hidden;
            animation: borderPulse 2.2s ease-in-out infinite;
        }
        @keyframes borderPulse {
            0%,100% { box-shadow: 0 0 0 3px rgba(56,189,248,0.12), 0 4px 24px rgba(10,25,47,0.45), 0 0 18px rgba(56,189,248,0.18); border-color: rgba(56,189,248,0.45); }
            50%      { box-shadow: 0 0 0 4px rgba(56,189,248,0.28), 0 4px 32px rgba(10,25,47,0.55), 0 0 32px rgba(56,189,248,0.38); border-color: rgba(56,189,248,0.85); }
        }
        .slide-track::before {
            content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 28%;
            background: linear-gradient(90deg, transparent, rgba(56,189,248,0.10), rgba(56,189,248,0.18), rgba(255,255,255,0.07), transparent);
            animation: scanLine 2.4s ease-in-out infinite; pointer-events: none; z-index: 1;
        }
        @keyframes scanLine { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
        .slide-label {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.82);
            letter-spacing: 0.18em; text-transform: uppercase; pointer-events: none; z-index: 2;
            text-shadow: 0 0 12px rgba(56,189,248,0.6);
            animation: arrowMarquee 2s ease-in-out infinite; user-select: none;
        }
        @keyframes arrowMarquee { 0%,100% { letter-spacing: 0.18em; opacity: 0.72; } 50% { letter-spacing: 0.28em; opacity: 1; } }
        .slide-fill {
            position: absolute; left: 0; top: 0; bottom: 0;
            background: linear-gradient(90deg, rgba(56,189,248,0.18), rgba(56,189,248,0.32));
            pointer-events: none; transition: width 0.05s linear; z-index: 0;
        }
        .slide-thumb {
            position: absolute; left: 5px; top: 5px; bottom: 5px; width: 52px;
            background: linear-gradient(145deg, #1e4a7a, #1B365D); border-radius: 11px;
            display: flex; align-items: center; justify-content: center; color: #fff; cursor: grab; z-index: 10;
            border: 1px solid rgba(56,189,248,0.5); animation: thumbPulse 2.2s ease-in-out infinite; transition: background 0.2s;
        }
        .slide-thumb:active { cursor: grabbing; background: linear-gradient(145deg, #255a92, #1B365D); }
        .slide-thumb i { font-size: 16px; color: #38BDF8; filter: drop-shadow(0 0 6px rgba(56,189,248,0.9)); }

        /* Modals & Inputs */
        @keyframes modalDrop { from { opacity:0; transform: scale(0.88) translateY(-16px); } to { opacity:1; transform: scale(1) translateY(0); } }
        .modal-card { animation: modalDrop 0.32s cubic-bezier(0.16,1,0.3,1) forwards; }
        .modal-backdrop { background: rgba(10,25,47,0.82); backdrop-filter: blur(6px); }
        .field-err { display:none; font-size:11px; color:#ef4444; font-weight:600; margin-top:3px; }
        .field-err.show { display:block; }
        input.err-border, textarea.err-border { border-color:#ef4444 !important; }
        
        /* Custom Radio Button */
        .custom-radio { appearance: none; width: 1.25rem; height: 1.25rem; border: 2px solid #cbd5e1; border-radius: 50%; outline: none; transition: all 0.2s; cursor: pointer; position: relative; }
        .custom-radio:checked { border-color: #38BDF8; background-color: #38BDF8; }
        .custom-radio:checked::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 0.5rem; height: 0.5rem; background-color: white; border-radius: 50%; }
        
        /* Tabs Styling */
        .tab-btn { position: relative; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); width: 60%; height: 3px; background-color: #1B365D; border-radius: 3px; }
    </style>
</head>
<body class="font-sans text-slate-800 text-sm">

<div class="app-container flex flex-col pb-32">

    <!-- Premium Header with Logo -->
    <div class="bg-navyPrimary text-center py-5 px-3 shadow-md rounded-b-3xl mb-4 relative overflow-hidden hdr-shine border-b-2 border-sky-400/30">
        <div class="inline-block mb-2 relative z-10 step-pulse">
            <img src="Logo PNG-white.png" alt="Independence Hotel Logo" class="h-16 w-auto mx-auto object-contain drop-shadow-md">
        </div>
        <h1 class="text-white text-[15px] font-extrabold tracking-widest uppercase relative z-10 drop-shadow-sm">INDEPENDENCE HOTEL</h1>
        <p class="text-sky-300 text-[11px] mt-0.5 font-bold tracking-wider relative z-10 drop-shadow-sm">SMART IN-ROOM DINING</p>
        <div class="mt-3 inline-block bg-navyDark/50 border border-sky-400/30 text-sky-200 px-3 py-1 rounded-full text-[10px] font-bold relative z-10">
            <i class="fa-solid fa-phone-volume mr-1"></i> Dial 830 for Assistance
        </div>
    </div>

    <div class="px-3 space-y-4">
        
        <!-- Delivery Form -->
        <div class="bg-cardWhite p-4 rounded-2xl shadow-sm border border-slate-200/80 space-y-3 card-enter">
            <div class="flex items-center space-x-2 border-b border-slate-100 pb-2">
                <i class="fa-solid fa-door-open text-navyPrimary text-xs"></i>
                <h2 class="font-extrabold text-navyPrimary text-xs uppercase tracking-wide">Delivery Information</h2>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1 block">Room Number *</label>
                    <div class="relative">
                        <input type="number" id="roomNumber" placeholder="e.g. 302" class="w-full pl-8 pr-2 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-navyPrimary focus:ring-2 focus:ring-sky-400 transition-all" oninput="clearFieldErr('roomNumber','errRoom')">
                        <i class="fa-solid fa-bed absolute left-3 top-3.5 text-slate-400 text-xs"></i>
                    </div>
                    <p class="field-err" id="errRoom">Required</p>
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1 block">Guest Name *</label>
                    <div class="relative">
                        <input type="text" id="guestName" placeholder="Your Name" class="w-full pl-8 pr-2 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-navyPrimary focus:ring-2 focus:ring-sky-400 transition-all" oninput="clearFieldErr('guestName','errName')">
                        <i class="fa-regular fa-user absolute left-3 top-3.5 text-slate-400 text-xs"></i>
                    </div>
                    <p class="field-err" id="errName">Required</p>
                </div>
            </div>
        </div>

        <!-- Sticky Search & Tabs -->
        <div class="sticky top-0 z-30 bg-[#F8FAFC] pt-1 pb-3 space-y-3">
            <!-- Search Box -->
            <div class="relative shadow-sm">
                <input type="text" id="searchBox" placeholder="Search menu..." class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm font-semibold text-slate-700 focus:ring-2 focus:ring-sky-400 focus:outline-none transition-all" onkeyup="handleSearch()">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400"></i>
            </div>

            <!-- Scrollable Tabs -->
            <div class="flex overflow-x-auto space-x-1 pb-1 no-scrollbar border-b border-slate-200" id="categoryTabs">
                <button onclick="filterMenu('all', this)" class="tab-btn active px-4 py-2 text-navyPrimary font-extrabold text-xs whitespace-nowrap transition-all">All Items</button>
                <button onclick="filterMenu('breakfast', this)" class="tab-btn px-4 py-2 text-slate-500 font-bold text-xs whitespace-nowrap transition-all hover:text-navyPrimary">Breakfast</button>
                <button onclick="filterMenu('starters', this)" class="tab-btn px-4 py-2 text-slate-500 font-bold text-xs whitespace-nowrap transition-all hover:text-navyPrimary">Starters & Soups</button>
                <button onclick="filterMenu('asian', this)" class="tab-btn px-4 py-2 text-slate-500 font-bold text-xs whitespace-nowrap transition-all hover:text-navyPrimary">Rice & Noodle</button>
                <button onclick="filterMenu('pasta', this)" class="tab-btn px-4 py-2 text-slate-500 font-bold text-xs whitespace-nowrap transition-all hover:text-navyPrimary">Pasta & Pizza</button>
                <button onclick="filterMenu('snacks', this)" class="tab-btn px-4 py-2 text-slate-500 font-bold text-xs whitespace-nowrap transition-all hover:text-navyPrimary">Snacks</button>
                <button onclick="filterMenu('mains', this)" class="tab-btn px-4 py-2 text-slate-500 font-bold text-xs whitespace-nowrap transition-all hover:text-navyPrimary">Main Courses</button>
                <button onclick="filterMenu('desserts', this)" class="tab-btn px-4 py-2 text-slate-500 font-bold text-xs whitespace-nowrap transition-all hover:text-navyPrimary">Desserts</button>
                <button onclick="filterMenu('drinks', this)" class="tab-btn px-4 py-2 text-slate-500 font-bold text-xs whitespace-nowrap transition-all hover:text-navyPrimary">Beverages</button>
            </div>
        </div>

        <!-- Menu List -->
        <div id="menuContainer" class="space-y-3">
            <!-- Dynamic Injection -->
        </div>
        
        <!-- Empty State (Hidden by default) -->
        <div id="emptyState" class="hidden text-center py-10">
            <i class="fa-solid fa-plate-wheat text-4xl text-slate-300 mb-3"></i>
            <p class="text-slate-500 font-semibold text-sm">No items found.</p>
        </div>
    </div>
</div>

<!-- ═══════════════════════════ OPTIONS / MEAT SELECTION MODAL ═══════════════════════════ -->
<div id="optionsModal" class="modal-backdrop fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="modal-card bg-white w-full max-w-[380px] rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden border border-slate-100 flex flex-col max-h-[90vh]">
        <div class="px-5 py-4 flex justify-between items-center bg-slate-50 border-b border-slate-100 shrink-0">
            <div>
                <h3 id="optItemName" class="font-extrabold text-navyPrimary text-sm leading-tight">Item Name</h3>
                <p id="optItemPrice" class="text-sky-600 font-bold text-xs mt-0.5">$0.00</p>
            </div>
            <button onclick="closeOptionsModal()" class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 hover:bg-slate-300 flex items-center justify-center transition-all"><i class="fa-solid fa-xmark text-sm"></i></button>
        </div>
        
        <!-- Options Form Container -->
        <div id="optContainer" class="p-5 overflow-y-auto space-y-5 flex-1 bg-white">
            <!-- Injected Option Groups -->
        </div>
        
        <div class="p-4 bg-slate-50 border-t border-slate-100 shrink-0">
            <button type="button" onclick="confirmOptionsSelection()" class="bg-navyPrimary hover:bg-navyDark text-white w-full py-3.5 rounded-xl text-xs font-extrabold shadow-md btn-press flex items-center justify-center space-x-2">
                <i class="fa-solid fa-cart-plus"></i><span>ADD TO ORDER</span>
            </button>
        </div>
    </div>
</div>

<!-- ═══════════════════════════ STICKY FOOTER CART ═══════════════════════════ -->
<div id="cartFooter" class="fixed bottom-0 left-0 w-full bg-transparent p-3 z-20 pointer-events-none hidden">
    <div class="max-w-[430px] mx-auto bg-navyPrimary/95 backdrop-blur-md border border-navyDark p-3.5 shadow-2xl rounded-2xl pointer-events-auto flex items-center justify-between footer-bar">
        <div>
            <p class="text-[10px] text-sky-300 font-bold uppercase tracking-wider"><span id="totalQtyDisplay" class="text-white">0</span> Items</p>
            <p class="text-xl font-black text-white">$<span id="totalPriceDisplay" class="num-flip inline-block">0.00</span> <span class="text-[9px] text-slate-400 font-medium">(Net)</span></p>
        </div>
        <button type="button" onclick="openCartModal()" class="bg-sky-500 hover:bg-sky-400 text-white px-5 py-3 rounded-xl text-xs font-extrabold transition-all flex items-center space-x-1.5 btn-press shadow-lg shadow-sky-500/40">
            <span>REVIEW</span><i class="fa-solid fa-arrow-right text-[10px]"></i>
        </button>
    </div>
</div>

<!-- ═══════════════════════════ CHECKOUT MODAL ═══════════════════════════ -->
<div id="checkoutModal" class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
    <div class="modal-card bg-white rounded-3xl w-full max-w-[380px] shadow-2xl overflow-hidden border border-slate-100 flex flex-col max-h-[90vh]">
        
        <div class="bg-gradient-to-r from-navyDark to-navyPrimary px-5 py-4 flex justify-between items-center relative overflow-hidden hdr-shine shrink-0">
            <div class="flex items-center space-x-3 relative z-10">
                <div class="w-9 h-9 rounded-full bg-white/15 flex items-center justify-center border border-white/25 step-pulse"><i class="fa-solid fa-file-invoice-dollar text-white text-sm"></i></div>
                <div>
                    <p class="text-white font-extrabold text-xs uppercase tracking-widest">Order Summary</p>
                    <p class="text-sky-300 text-[10px] font-medium mt-0.5">Please review before sliding</p>
                </div>
            </div>
            <button onclick="document.getElementById('checkoutModal').classList.add('hidden')" class="text-white/60 hover:text-white relative z-10 p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>

        <div class="p-4 overflow-y-auto bg-slate-50 flex-1 space-y-4">
            <!-- Cart Items -->
            <div id="modalCartItems" class="space-y-2"></div>
            
            <!-- Order Notes Area -->
            <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                <label class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-2 flex items-center"><i class="fa-regular fa-comment-dots mr-1.5 text-navyPrimary"></i>Additional Notes (Optional)</label>
                <textarea id="orderNotes" rows="2" placeholder="e.g. Less spicy, extra napkins..." class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-medium text-slate-700 focus:ring-2 focus:ring-sky-400 focus:outline-none transition-all resize-none"></textarea>
            </div>
        </div>

        <div class="p-4 bg-white border-t border-slate-100 shrink-0 space-y-4">
            <!-- Price Breakdown (+15.5%) -->
            <div class="border-b border-slate-100 pb-3 space-y-2 mb-2">
                <div class="flex justify-between items-center text-[11px] text-slate-500 font-bold uppercase tracking-wide">
                    <span>Subtotal</span><span>$<span id="modalSubtotal">0.00</span></span>
                </div>
                <div class="flex justify-between items-center text-[11px] text-sky-600 font-bold uppercase tracking-wide">
                    <span>Tax (10%) & Service (5%)</span><span>+$<span id="modalTax">0.00</span></span>
                </div>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-xs font-black text-slate-700 uppercase tracking-wider">Grand Total</span>
                <span class="text-xl font-black text-navyPrimary">$<span id="modalTotalAmount">0.00</span></span>
            </div>
            
            <!-- Slide to Confirm -->
            <div id="slideTrack" class="slide-track select-none" style="height:58px;">
                <div id="slideFill" class="slide-fill" style="width:0"></div>
                <span class="slide-label">SLIDE TO ORDER &nbsp;›&nbsp;›</span>
                <div id="slideThumb" class="slide-thumb"><i class="fa-solid fa-angles-right"></i></div>
            </div>
        </div>
    </div>
</div>

    let cart = {}; // cart structure: { '1|Meat:Seafood|Noodle:Egg': { item, qty, optionsStr } }
    let currentFilter = 'all';
    let tempOptionItemId = null;

    function renderMenu() {
        const container = document.getElementById('menuContainer');
        const emptyState = document.getElementById('emptyState');
        container.innerHTML = '';
        
        const searchTxt = document.getElementById('searchBox').value.toLowerCase();
        
        const filtered = menuData.filter(item => {
            const matchCat = currentFilter === 'all' || item.category === currentFilter;
            const matchSearch = item.name.toLowerCase().includes(searchTxt) || (item.cnName && item.cnName.toLowerCase().includes(searchTxt));
            return matchCat && matchSearch;
        });

        if (filtered.length === 0) {
            emptyState.classList.remove('hidden');
        } else {
            emptyState.classList.add('hidden');
            filtered.forEach((item, idx) => {
                // Count total qty of this item across all its variations in cart
                let totalQty = 0;
                for (let key in cart) { if (cart[key].item.id === item.id) totalQty += cart[key].qty; }

                const card = document.createElement('div');
                card.className = 'bg-cardWhite p-3.5 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col space-y-2.5 menu-card card-enter';
                card.style.animationDelay = (0.02 * idx) + 's';
                
                let btnHtml = '';
                if (item.options && item.options.length > 0) {
                    // Item WITH Options: Show ADD button
                    btnHtml = `
                        ${totalQty > 0 ? `<span class="mr-2 text-xs font-bold text-sky-600 bg-sky-50 px-2 py-1 rounded-md shadow-sm border border-sky-100">${totalQty} selected</span>` : ''}
                        <button type="button" class="bg-navyPrimary text-white px-4 py-1.5 rounded-lg font-bold text-xs shadow-sm hover:bg-navyDark btn-press" onclick="openOptionsModal(${item.id})">
                            ADD <i class="fa-solid fa-plus ml-1 text-[10px]"></i>
                        </button>`;
                } else {
                    // Item WITHOUT Options: Standard - 1 +
                    btnHtml = `
                        <div class="flex items-center space-x-1 bg-slate-50 rounded-xl p-1 border border-slate-200 shrink-0">
                            <button type="button" class="qty-btn w-8 h-8 flex items-center justify-center text-slate-500 bg-white rounded-lg shadow-sm border border-slate-200 btn-press font-bold" onclick="updateSimpleQty(${item.id}, -1)">-</button>
                            <span id="qty-${item.id}" class="font-black text-navyDark w-6 text-center text-sm">${totalQty}</span>
                            <button type="button" class="qty-btn w-8 h-8 flex items-center justify-center text-white bg-navyPrimary rounded-lg shadow-sm btn-press font-bold" onclick="updateSimpleQty(${item.id}, 1)">+</button>
                        </div>`;
                }

                card.innerHTML = `
                    <div class="flex items-start space-x-3 pr-1">
                        <div class="w-10 h-10 rounded-xl bg-sky-50 flex items-center justify-center shrink-0 border border-sky-100 text-lg text-sky-500 shadow-sm mt-0.5">
                            <i class="fa-solid ${item.icon}"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-sm text-navyPrimary leading-tight">${item.name}</h3>
                            ${item.cnName ? `<p class="text-[11px] text-slate-500 font-semibold mb-0.5">${item.cnName}</p>` : ''}
                            <p class="text-[10.5px] text-slate-400 leading-snug line-clamp-3">${item.desc}</p>
                        </div>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-slate-100">
                        <p class="text-[13px] font-extrabold text-sky-500">$${item.price.toFixed(2)}</p>
                        <div class="flex items-center justify-end">${btnHtml}</div>
                    </div>`;
                container.appendChild(card);
            });
        }
    }

    function filterMenu(category, element) {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active', 'text-navyPrimary', 'font-extrabold');
            btn.classList.add('text-slate-500', 'font-bold');
        });
        element.classList.remove('text-slate-500', 'font-bold');
        element.classList.add('active', 'text-navyPrimary', 'font-extrabold');
        
        currentFilter = category;
        renderMenu();
    }

    function handleSearch() { renderMenu(); }

    // --- CART LOGIC FOR SIMPLE ITEMS (No Options) ---
    function updateSimpleQty(id, change) {
        const key = id.toString();
        if (!cart[key]) {
            if (change > 0) cart[key] = { item: menuData.find(i => i.id === id), qty: 1, optionsStr: '' };
        } else {
            cart[key].qty += change;
            if (cart[key].qty <= 0) delete cart[key];
        }
        
        const qtyEl = document.getElementById(`qty-${id}`);
        if(qtyEl) {
            qtyEl.innerText = cart[key] ? cart[key].qty : 0;
            qtyEl.classList.remove('qty-pop'); void qtyEl.offsetWidth; qtyEl.classList.add('qty-pop');
        }
        updateCartFooter();
    }

    // --- OPTIONS MODAL LOGIC ---
    function openOptionsModal(id) {
        tempOptionItemId = id;
        const item = menuData.find(i => i.id === id);
        document.getElementById('optItemName').innerText = item.name;
        document.getElementById('optItemPrice').innerText = "$" + item.price.toFixed(2);
        
        const container = document.getElementById('optContainer');
        container.innerHTML = '';
        
        item.options.forEach((optGroup, gIdx) => {
            let html = `
                <div class="opt-group" data-title="${optGroup.title}">
                    <label class="text-[11px] font-extrabold text-navyPrimary uppercase tracking-wider mb-2 flex items-center"><span class="w-1.5 h-1.5 rounded-full bg-sky-400 mr-1.5"></span> ${optGroup.title} <span class="text-red-500 ml-1">*</span></label>
                    <div class="space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
            `;
            optGroup.choices.forEach((choice, cIdx) => {
                const radioId = `opt_${gIdx}_${cIdx}`;
                const isChecked = cIdx === 0 ? 'checked' : ''; // Default first choice
                html += `
                    <label for="${radioId}" class="flex items-center justify-between cursor-pointer p-1">
                        <span class="text-xs font-semibold text-slate-700">${choice}</span>
                        <input type="radio" id="${radioId}" name="group_${gIdx}" value="${choice}" class="custom-radio" ${isChecked}>
                    </label>
                `;
            });
            html += `</div></div>`;
            container.innerHTML += html;
        });

        document.getElementById('optionsModal').classList.remove('hidden');
    }

    function closeOptionsModal() {
        document.getElementById('optionsModal').classList.add('hidden');
        tempOptionItemId = null;
    }

    function confirmOptionsSelection() {
        if (!tempOptionItemId) return;
        const item = menuData.find(i => i.id === tempOptionItemId);
        const groups = document.querySelectorAll('.opt-group');
        let selectedOptions = [];
        
        groups.forEach(group => {
            const title = group.getAttribute('data-title');
            const selectedRadio = group.querySelector('input[type="radio"]:checked');
            if(selectedRadio) {
                selectedOptions.push(`${title}: ${selectedRadio.value}`);
            }
        });

        const optionsStr = selectedOptions.join(' | ');
        const key = item.id + '|' + optionsStr;

        if (!cart[key]) {
            cart[key] = { item: item, qty: 1, optionsStr: optionsStr };
        } else {
            cart[key].qty += 1;
        }

        closeOptionsModal();
        renderMenu(); // Re-render to update badges
        updateCartFooter();
    }

    // --- CART MANAGEMENT ---
    function changeCartItemQty(key, change) {
        if (cart[key]) {
            cart[key].qty += change;
            if (cart[key].qty <= 0) delete cart[key];
            updateCartFooter();
            openCartModal(); // Re-render checkout modal
            renderMenu();    // Re-render background menu badges
        }
    }

    function updateCartFooter() {
        let totalCount = 0, subTotalPrice = 0;
        for (let key in cart) {
            totalCount += cart[key].qty;
            subTotalPrice += cart[key].item.price * cart[key].qty;
        }
        
        let grandTotal = subTotalPrice * 1.155; // +15.5% tax & service

        document.getElementById('totalQtyDisplay').innerText = totalCount;
        const priceEl = document.getElementById('totalPriceDisplay');
        priceEl.innerText = grandTotal.toFixed(2);
        priceEl.classList.remove('num-flip'); void priceEl.offsetWidth; priceEl.classList.add('num-flip');
        
        const footer = document.getElementById('cartFooter');
        totalCount > 0 ? footer.classList.remove('hidden') : footer.classList.add('hidden');
    }

    // Validation
    function showFieldErr(id, errId) { document.getElementById(id).classList.add('err-border'); document.getElementById(errId).classList.add('show'); }
    function clearFieldErr(id, errId) { document.getElementById(id).classList.remove('err-border'); document.getElementById(errId).classList.remove('show'); }

    function openCartModal() {
        const room = document.getElementById('roomNumber').value.trim();
        const name = document.getElementById('guestName').value.trim();
        let ok = true;
        if(!room) { showFieldErr('roomNumber', 'errRoom'); ok = false; }
        if(!name) { showFieldErr('guestName', 'errName'); ok = false; }
        if(!ok) { window.scrollTo({top:0, behavior:'smooth'}); return; }

        const container = document.getElementById('modalCartItems');
        container.innerHTML = '';
        let subTotal = 0;

        for (let key in cart) {
            const cartObj = cart[key];
            const item = cartObj.item;
            subTotal += item.price * cartObj.qty;
            
            // Format Options display
            let optHtml = cartObj.optionsStr ? `<p class="text-[10px] text-sky-600 font-bold bg-sky-50 px-1.5 py-0.5 rounded mt-1 inline-block border border-sky-100">${cartObj.optionsStr}</p>` : '';

            container.innerHTML += `
                <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                    <div class="flex-1 pr-2">
                        <p class="font-bold text-navyPrimary text-xs leading-tight">${item.name}</p>
                        <p class="text-[10px] text-slate-400 font-semibold mt-0.5">$${item.price.toFixed(2)} / item</p>
                        ${optHtml}
                    </div>
                    <div class="flex flex-col items-end space-y-2 shrink-0">
                        <span class="font-black text-navyPrimary text-sm">$${(item.price * cartObj.qty).toFixed(2)}</span>
                        <div class="flex items-center space-x-1 bg-slate-50 rounded-lg p-0.5 border border-slate-200">
                            <button type="button" onclick="changeCartItemQty('${key}', -1)" class="w-6 h-6 flex items-center justify-center text-slate-500 bg-white rounded shadow-sm border border-slate-200 btn-press font-bold">-</button>
                            <span class="font-black text-navyDark w-4 text-center text-xs">${cartObj.qty}</span>
                            <button type="button" onclick="changeCartItemQty('${key}', 1)" class="w-6 h-6 flex items-center justify-center text-white bg-navyPrimary rounded shadow-sm btn-press font-bold">+</button>
                        </div>
                    </div>
                </div>`;
        }
        
        if(Object.keys(cart).length === 0) {
            container.innerHTML = '<p class="text-center text-slate-400 text-xs py-4 font-semibold">Your cart is empty.</p>';
            document.getElementById('slideTrack').style.opacity = '0.5';
            document.getElementById('slideTrack').style.pointerEvents = 'none';
        } else {
            document.getElementById('slideTrack').style.opacity = '1';
            document.getElementById('slideTrack').style.pointerEvents = 'auto';
        }

        const taxAndService = subTotal * 0.155;
        const grandTotal = subTotal + taxAndService;

        document.getElementById('modalSubtotal').innerText = subTotal.toFixed(2);
        document.getElementById('modalTax').innerText = taxAndService.toFixed(2);
        document.getElementById('modalTotalAmount').innerText = grandTotal.toFixed(2);
        
        document.getElementById('checkoutModal').classList.remove('hidden');
        resetSlider();
    }

    /* ─── SLIDE TO CONFIRM ─── */
    const slideTrack = document.getElementById('slideTrack');
    const slideThumb = document.getElementById('slideThumb');
    const slideFill = document.getElementById('slideFill');
    let dragging = false, startX = 0, trackW = 0;
    
    function resetSlider() {
        slideThumb.style.transition = 'transform .3s cubic-bezier(.34,1.56,.64,1)';
        slideFill.style.transition = 'width .3s cubic-bezier(.34,1.56,.64,1)';
        slideThumb.style.transform = 'translateX(0px)';
        slideFill.style.width = '0px';
    }
    const cx = e => e.touches ? e.touches[0].clientX : e.clientX;
    const startDrag = e => { dragging=true; startX=cx(e); trackW=slideTrack.clientWidth-slideThumb.clientWidth-8; slideThumb.style.transition='none'; slideFill.style.transition='none'; };
    const moveDrag = e => { if(!dragging)return; let d=Math.min(Math.max(cx(e)-startX,0),trackW); slideThumb.style.transform=`translateX(${d}px)`; slideFill.style.width=`${d+slideThumb.clientWidth}px`; };
    
    slideThumb.addEventListener('mousedown', startDrag);
    slideThumb.addEventListener('touchstart', startDrag, {passive:true});
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('touchmove', moveDrag, {passive:true});
    window.addEventListener('mouseup', stopSlide);
    window.addEventListener('touchend', stopSlide);
    
    function stopSlide() {
        if(!dragging) return; dragging = false;
        const m = window.getComputedStyle(slideThumb).transform;
        let cur = 0;
        if(m && m!=='none'){ const v=m.match(/matrix.*\(([-0-9., ]+)\)/)?.[1].split(',').map(Number); if(v) cur = v.length===6 ? v[4] : v[12]||0; }
        
        if(cur >= trackW * 0.75) {
            slideThumb.style.transform = `translateX(${trackW}px)`;
            slideFill.style.width = '100%';
            setTimeout(() => { 
                document.getElementById('checkoutModal').classList.add('hidden'); 
                resetSlider(); 
                processOrder(); 
            }, 250);
        } else { resetSlider(); }
    }

    /* ─── FAKE PROCESSING LOGIC ─── */
    function processOrder() {
        // Collect Note
        const noteValue = document.getElementById('orderNotes').value.trim();
        console.log("Guest Order Note:", noteValue);

        // Show Overlay
        const overlay = document.getElementById('loadingOverlay');
        overlay.classList.remove('hidden');
        
        // Reset Steps...
        // [This keeps your existing 3-step loading animation logic]
        setTimeout(() => { document.getElementById('progSub').innerText = 'Dispatching order to server...'; }, 500);
        setTimeout(() => { document.getElementById('progSub').innerText = 'Updating Kitchen Telegram...'; }, 1500);
        setTimeout(() => { 
            document.getElementById('progTitle').innerText = 'ORDER COMPLETED! 🎉';
            document.getElementById('progSub').innerText = 'Your food is being prepared.';
            if('vibrate' in navigator) navigator.vibrate([80, 40, 80]);
            setTimeout(() => { window.location.reload(); }, 3500);
        }, 2500);
    }

    // Init
    renderMenu();
</script>
